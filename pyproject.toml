[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mudline"
version = "0.1.0"
description = "AI-powered personal data layer over iOS backups"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Reece Long" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    # Engine: index (vector + structured retrieval)
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # Engine: intelligence (LLM provider abstraction)
    "anthropic>=0.40",
    "httpx>=0.27",
    # Interface
    "typer>=0.12",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "textual>=0.80",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# iOS backup discovery and extraction. Required to ingest real iOS backups;
# the engine (models + index + intelligence.llm) does not need these.
ios = [
    "iOSbackup>=0.9",
    "protobuf>=5.0",
    "Pillow>=10.0",
]
# CLIP image embeddings for media search.
media = [
    "open-clip-torch>=2.26",
    "Pillow>=10.0",
]
# Google Vertex AI / Gemini provider (pulls google-auth transitively for ADC).
vertex = [
    "google-genai>=1.0",
]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "import-linter>=2.0",
]

[project.urls]
Homepage = "https://github.com/reecelong/mudline"
Repository = "https://github.com/reecelong/mudline"
Issues = "https://github.com/reecelong/mudline/issues"

[project.scripts]
mudline = "mudline.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mudline"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# Enforce the engine seam: the domain-agnostic core (models + index +
# intelligence.llm + exceptions) must never import the iOS application layers or
# the iOS-tuned query orchestration. This is what lets a downstream app depend
# on the engine subset alone. Run with `lint-imports`.
[tool.importlinter]
root_package = "mudline"

[[tool.importlinter.contracts]]
name = "Engine must not import the mudline application layers"
type = "forbidden"
source_modules = [
    "mudline.models",
    "mudline.index",
    "mudline.intelligence.llm",
    "mudline.exceptions",
]
forbidden_modules = [
    "mudline.foundation",
    "mudline.extractors",
    "mudline.intelligence.planner",
    "mudline.intelligence.synthesizer",
    "mudline.intelligence.tools",
    "mudline.intelligence.router",
    "mudline.intelligence.context",
    "mudline.intelligence.memory",
    "mudline.cli",
    "mudline.api",
]
